[package]
name = "openclaw-bot"
version = "1.1.0"
edition = "2021"
description = "OpenClaw Bot: chats, Bots y administración de OpenClaw, local o remoto"
license = "MIT"
repository = "https://github.com/elgodox/openclaw-bot"

[[bin]]
name = "openclaw-bot"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard"] }
egui_extras = { version = "0.37", features = ["image"] }
egui_commonmark = { version = "0.26", features = ["better_syntax_highlighting"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
semver = "1"

[build-dependencies]
winresource = "0.1"


[dev-dependencies]
rcgen = "0.13"

[profile.release]
opt-level = 2
